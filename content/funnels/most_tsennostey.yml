key: most_tsennostey_telegram
version: 2
title: Мост ценностей — Telegram
calendar_day_schedule: true
steps:
  - key: day_1_welcome
    delay: 0m
    channel: telegram_most
    text: |-
      Доброго времени суток!

      Вы в пространстве, где мы исследуем внутреннюю опору и зависимость от внешних факторов в нашей жизни: от денег, отношений, чужого мнения.

      Иногда мы думаем, что нам нужен конкретный человек, определённая сумма или признание. Но за внешней целью может скрываться более глубокая потребность: в безопасности, любви, самоценности или внутренней силе.

      Я предлагаю вам пройти короткую самопроверку и получить небольшое видео о том, как работает наша система и тренинг.
  - key: day_1_about
    delay: 1m
    channel: telegram_most
    text: |-
      Что это за тренинг?

      Это практический офлайн-тренинг «Мост ценностей».

      За один день участники исследуют один повторяющийся жизненный сценарий: страх потери, сложности с финансами, стремление заслужить любовь, болезненную реакцию на критику или постоянное желание всё контролировать.

      В программе — письменные практики, работа в парах, круги, личные беседы и упражнения с ценностями.

      Это не марафон исполнения желаний и не волшебная таблетка для всего на свете. Это пространство для осознанного наблюдения и выбора новых действий.
  - key: day_1_leader
    delay: 1m
    channel: telegram_most
    text: |-
      Кто ведёт программу?

      Программу ведёт Айсу Кам — родовой шаман, экстрасенс, последовательница Гаудия-вайшнавской традиции, автор духовно-коучинговых программ о внутреннем состоянии, ценностях, отношениях с собой, людьми и Высшим.

      В работе соединяются духовные смыслы, коучинговые вопросы, письменные практики и бережная групповая работа.

      Главный принцип программы — не навязывать участнику готовые ответы, а помочь ему увидеть собственный сценарий и найти более свободный способ действовать.

      Важно! Тренинг проходит в Москве: основная программа — 3 и 5 сентября, а 4 сентября предусмотрена необязательная бесплатная выездная часть.
  - key: day_1_context
    delay: 1m
    channel: telegram_most
    text: |-
      Иногда кажется, что для спокойствия нам не хватает чего-то конкретного.

      Денег — чтобы не бояться будущего.
      Ответа от близкого человека — чтобы не чувствовать себя отвергнутым.
      Признания — чтобы поверить в себя.
      Контроля — чтобы не столкнуться с неопределённостью.
      Нужного результата — чтобы наконец выдохнуть.

      Сами по себе желания нормальны. Нам действительно важны безопасность, близость, уважение, реализация и возможность влиять на свою жизнь.

      Трудность начинается в тот момент, когда внешний объект становится единственным источником внутреннего равновесия.

      Тогда деньги перестают быть просто ресурсом и начинают означать: «без них я не справлюсь».
      Отношения перестают быть встречей двух людей и превращаются в доказательство: «меня можно любить».
      Результат перестаёт быть целью и становится условием самоценности: «если не получилось, значит, со мной что-то не так или что мне надо это во что бы то ни стало».
      Контроль перестаёт помогать действовать и превращается в попытку защититься от самой жизни.

      Внутренняя опора не означает отказаться от целей, денег, отношений или развития. Она означает другое: не терять себя, пока желаемое ещё не пришло; замечать тревогу, не подчиняясь ей автоматически; действовать яснее, не разрушая себя и отношения, а также быть поистине внутренне счастливым вне зависимости от внешних обстоятельств.

      В ближайшие дни вы сможете посмотреть на свой привычный сценарий со стороны. Не как на диагноз и не как на «недостаток», а как на способ защиты, который можно лучше понять и постепенно изменить.

      Сегодня мы поговорим о зависимости от внешних источников счастья и достигнутых результатов.

      Мы часто связываем внутреннее спокойствие с тем, что должно произойти снаружи: прийти деньги, ответить человек, появиться признание, сложиться нужный результат.

      Внешние цели важны. Но когда только они становятся источником опоры, любое ожидание превращается в напряжение.

      Сегодня вы увидите, как возникает эта зависимость и где появляется точка, в которой можно не идти за автоматическим импульсом, а вернуть себе выбор.
  - key: quiz_invite
    delay: 1m
    channel: telegram_most
    text: |-
      Ответьте на вопросы, чтобы понять, какие глубокие программы сейчас активно делают выборы за вас в вашей жизни.

      При выборе ответов выберите вариант, который проявляется чаще всего или сильнее всего.
    buttons:
      - text: Пройти тест
  - key: lesson
    delay: 1h
    channel: telegram_most
    text: |-
      Сейчас вы можете посмотреть короткий урок:
      «Почему мы зависим от результата и как вернуть себе точку выбора».

      В нём мы разберём:
      • почему желаемый объект начинает казаться единственным источником счастья;
      • как возникает сужение внимания;
      • почему импульсивное действие даёт только краткое облегчение;
      • как переключить внимание с результата на процесс.

      Ссылку на видео добавим сюда отдельно.
  - key: reflection
    delay: 30m
    channel: telegram_most
    text: Что откликнулось вам сильнее всего?
    buttons:
      - text: Я завишу от реакции людей
        callback_data: reflection_people
      - text: Я зацикливаюсь на деньгах
        callback_data: reflection_money
      - text: Мне сложно отпускать контроль
        callback_data: reflection_control
      - text: Я хочу разобрать свою ситуацию глубже
        callback_data: reflection_deeper
  - key: day_2_practice
    delay: 1d
    channel: telegram_most
    text: |-
      Доброго дня! У каждого человека есть моменты, когда внимание будто сужается вокруг одной вещи.

      Нужно, чтобы пришли деньги.
      Нужно, чтобы человек ответил.
      Нужно, чтобы нас одобрили.
      Нужно, чтобы всё произошло по плану.
      Нужно, чтобы тревога исчезла прямо сейчас.

      В такие моменты желаемый объект начинает казаться не просто важным, а единственно возможным источником облегчения. Нам трудно видеть другие варианты, замечать последствия и спокойно выдерживать неопределённость.

      Возникает внутренний сценарий:

      «Когда я получу это — мне станет хорошо».
      «Когда другой человек изменит своё решение — я успокоюсь».
      «Когда всё будет под контролем — я смогу жить».

      Но краткое облегчение не всегда даёт устойчивость. Если мы действуем только из тревоги, то часто начинаем давить, заслуживать, спорить, проверять, избегать или принимать поспешные решения. А затем напряжение возвращается снова.

      Сегодняшняя самопроверка поможет увидеть, какой способ реакции включается у вас чаще. У одного человека это может быть тревога за деньги и безопасность. У другого — болезненная зависимость от оценки. У третьего — стремление удерживать всё под контролем.

      Результат не определяет вашу личность. Он лишь показывает одну из тем, которую сейчас полезно исследовать внимательнее.

      Сильная реакция редко возникает на пустом месте. Обычно есть цепочка: событие, ожидание, напряжение в теле, импульс что-то срочно сделать и последствие.

      Пока эта цепочка не замечена, кажется, что нами управляет сама ситуация или другой человек.

      Сегодня мы не будем искать виноватых и разбирать тяжёлые истории. Мы возьмём один обычный эпизод и спокойно увидим, где именно можно было вернуть себе паузу и свободу выбора.

      Сегодня мы предлагаем вам выполнить короткую письменную практику «Моя цепочка».
      Выберите одну ситуацию последних 30 дней, где были сильное желание, страх потери, обида, контроль или зависимость от чужого решения.

      Например:
      • вы ждали ответа;
      • боялись потерять клиента;
      • пытались вернуть человека;
      • болезненно отреагировали на критику;
      • совершили импульсивную покупку;
      • постоянно проверяли телефон.

      Запишите письменно на листочке (в боте писать не надо) ситуацию по девяти пунктам:
      1. Что было объектом желания?
      2. Что этот объект обещал дать вам внутри?
      3. Что стало препятствием?
      4. Какие чувства и телесные реакции появились?
      5. Что вы перестали замечать?
      6. Какой возник импульс?
      7. Что вы реально сделали?
      8. Что почувствовали сразу после действия?
      9. Какова была последующая цена?

      Отдельно отметьте момент, где можно было поставить паузу и выбрать другое действие.
    buttons:
      - text: Я заполнил(а) практику
      - text: Показать пример
      - text: Мне сложно выбрать ситуацию
  - key: day_3_polarities
    delay: 1d
    channel: telegram_most
    text: |-
      Прекрасного дня!

      У каждого из нас есть важные внутренние потребности: в безопасности, принятии, уважении, силе, свободе, смысле, принадлежности.

      Когда связь с такой опорой ослабевает, мы часто ищем её снаружи. И это может происходить двумя, на первый взгляд противоположными, способами.

      Первый способ — проседание.

      Например, человеку очень важно быть принятым. Тогда он может соглашаться против себя, терпеть неуважение, бояться сказать «нет», подстраиваться и заслуживать любовь.

      Второй способ — пьедестал.

      Та же потребность в принятии может проявиться иначе: «все должны уважать мои взгляды», «если со мной не согласны — меня обесценивают», «я докажу, что я прав». Внешне это выглядит как сила, но внутри часто всё та же уязвимость и страх быть непринятым.

      Так же работает безопасность. В проседании — «без денег, ценных вещей и гарантий я не справлюсь». На пьедестале — «деньги, статус и контроль должны доказать, что я выше и защищённее других».

      Здоровая середина не означает стать безразличным к деньгам, любви или уважению. Она означает вернуть им нормальное место в жизни.

      Я могу заботиться о безопасности, но не делать деньги или вещи единственным доказательством права на жизнь.
      Я могу ценить близость, но не отказываться от себя ради неё.
      Я могу защищать свои границы, но не подавлять другого человека.
      Я могу иметь ценности, но не требовать, чтобы все жили по ним.

      Одна и та же важная потребность может проявляться противоположно, обе из них связаны с дисбалансом по внутреннему ресурсу.

      Иногда мы отказываемся от себя, чтобы получить безопасность, любовь или признание. А иногда начинаем требовать этого от мира, контролировать, давить или не принимать чужое несогласие.

      Сегодня мы посмотрим не на «плохие качества», а на две защиты одной внутренней опоры — и найдём более здоровую середину.

      Например, если человек очень нуждается в принятии, он может:
      • в проседании — отказаться от себя, чтобы его любили;
      • на пьедестале — требовать, чтобы все принимали его ценности и взгляды;
      • в здоровой середине — сохранять себя и уважать свободу другого.

      Ресурс «Безопасность»:
      • проседание: «Без денег я не справлюсь»;
      • пьедестал: «Мой статус и доход должны быть выше всех»;
      • середина: «Я планирую, развиваю навыки и принимаю, что абсолютных гарантий нет».

      Ресурс «Любовь и принятие»:
      • проседание: «Я соглашусь на всё, лишь бы меня не бросили»;
      • пьедестал: «Ты обязан принять мои ценности, иначе ты плохой»;
      • середина: «Я могу быть собой и не заставлять другого соглашаться со мной».

      Ресурс «Внутренняя сила»:
      • проседание: «Пусть другие решают за меня»;
      • пьедестал: «Я сильнее, поэтому могу давить»;
      • середина: «Я могу защищать свои границы без подавления других».

      Предлагаю вам посмотреть, где ваши крайности, а где — здоровая середина, где вы проседаете по внутреннему ресурсу, а где слишком давите на мир и на себя.

      Ответьте письменно:
      1. Где я чаще всего отказываюсь от себя?
      2. Где я требую, чтобы другие соответствовали моим ценностям?
      3. Какую внутреннюю потребность я пытаюсь защитить?
      4. Как выглядел бы срединный способ действия?
    buttons:
      - text: Готово
  - key: day_4_values
    delay: 1d
    channel: telegram_most
    text: |-
      Доброго дня!

      Мы живём в мире, где многие важные результаты не могут зависеть только от нас.

      Нельзя полностью контролировать решение клиента.
      Нельзя заставить близкого человека ответить взаимностью.
      Нельзя гарантировать сроки, состояние рынка, реакцию аудитории или мнение начальника.
      Нельзя сделать так, чтобы жизнь всегда шла ровно по нашему плану.

      Но именно в этих зонах неопределённости особенно легко потерять внутреннюю опору.

      Мы начинаем ждать результата как разрешения жить спокойно. Пока он не получен, кажется, будто нужно сильнее торопиться, доказывать, давить, переделывать себя или контролировать других.

      Ценности предлагают другой ориентир.

      Ценность — это не красивое слово и не абстрактная идея. Это качество, которое можно проявить в действии уже сейчас.

      Честность — сказать ясно, без манипуляции.
      Уважение — не давить на другого, даже если очень хочется получить ответ.
      Мастерство — хорошо сделать свою часть работы.
      Ответственность — выполнить обещанное.
      Смелость — сделать необходимый шаг, даже если страшно.
      Благодарность — видеть то, что уже есть, а не только то, чего пока нет.

      Можно хотеть денег и действовать профессионально, не превращая тревогу в двигатель.
      Можно хотеть отношений и говорить о своих чувствах, не отказываясь от достоинства.
      Можно стремиться к результату и оставаться живым человеком, а не функцией, которая должна всё контролировать.

      Результат по-прежнему важен. Но он не должен быть единственным ответом на вопрос: «Имею ли я право быть спокойным, ценным и живым?»

      На тренинге «Мост ценностей» мы будем учиться соединять цель и ценность: идти к желаемому, но не терять себя по дороге.

      Самое важное…

      Результат важен. Но он не определяет, кем вы являетесь.

      Вопрос не только в том, чего вы хотите достичь.
      Вопрос ещё и в том: каким человеком вы выбираете быть на этом пути?

      Давайте сегодня просто подумаем вместе на тему: какие ценности я транслирую в мир и на что я в действительности опираюсь: на внешнее или на внутреннее, на ценности в пути или на важность достижения целей?

      Завтра вы узнаете, что именно мы будем делать на тренинге «Мост ценностей» и почему он способен помочь именно вам.
  - key: day_5_invitation
    delay: 1d
    channel: telegram_most
    text: |-
      Приветствую!

      За эти дни вы уже увидели несколько важных вещей: что запускает автоматическую реакцию, как внутренние потребности уходят во внешнюю зависимость и почему контроль не всегда возвращает устойчивость.

      В живом формате можно пойти глубже: через телесные практики, письменную работу, диалоги в парах, круги и бережную поддержку ведущей.

      Тренинг подойдёт тем, кто хочет не просто узнать о своих сценариях, а научиться замечать их в реальном моменте и выбирать другой способ действия.

      Офлайн-тренинг «Мост ценностей»
      Дата: 3 и 5 сентября 2026 года. 4 сентября — необязательная бесплатная выездная часть.
      Город: Москва

      В программе:
      • открывающий круг;
      • практика «Моя цепочка»;
      • «Колесо внутренних опор»;
      • «Галерея полярностей»;
      • практика «5 зачем»;
      • «Мост ценностей»;
      • личные мини-беседы;
      • практика санкальпы (намерения);
      • план интеграции на 21 день;
      • упражнения цигун;
      • одно выездное бесплатное мероприятие с необязательным участием.

      Группа — до 12 человек, чтобы сохранить камерность и возможность личного внимания.

      После тренинга у вас будет:
      • разобранный личный сценарий;
      • понимание своей основной внешней опоры;
      • карта проседания и пьедестала;
      • три ключевые ценности, на которые всегда можно опереться;
      • конкретное действие на ближайшие 72 часа;
      • план практики на 21 день.

      Мы не обещаем, что внешний мир начнёт исполнять конкретные желания. Мы работаем с тем, что находится в зоне вашего выбора: восприятием, ценностями, границами и действиями.

      Когда человек начинает замечать свои привычные сценарии — страх потери, зависимость от оценки, стремление всё контролировать или желание срочно получить результат, — у него появляется больше свободы в моменте выбора.

      Вместо импульсивного действия из тревоги появляется возможность остановиться, увидеть свои чувства, учесть последствия и выбрать более ясный следующий шаг.

      Вместо попытки заслужить любовь — честнее говорить о своих границах и потребностях.
      Вместо давления на другого человека — строить коммуникацию с уважением к себе и его свободе.
      Вместо бесконечного контроля — различать, где действительно нужна ответственность, а где нужно отпустить то, что не зависит от вас.
      Вместо ощущения «без этого я не справлюсь» — постепенно возвращать себе внутреннюю устойчивость.

      Из таких небольших, но повторяющихся выборов складывается другой способ жить: бережнее относиться к себе, яснее видеть людей и возможности, не разрушать отношения тревогой и действовать в согласии со своими ценностями.

      Именно это мы будем исследовать на тренинге «Мост ценностей» — через возвращение к себе, своим ценностям и способности действовать более свободно и осознанно.

      В стоимость входит:
      • участие в двухдневном тренинге;
      • личная мини-беседа или индивидуальная рефлексия;
      • лекция с практиками;
      • план интеграции на 21 день;
      • упражнения цигун;
      • закрытый чат участников на период сопровождения.

      Стоимость до 31 августа — 25 000 руб. Оплатить можно частями по внутренней рассрочке и через сервисы Долями, Яндекс Сплит.

      Оставьте заявку, я свяжусь с вами, и мы лично обсудим ваши цели, а также обговорим, сможет ли тренинг «Мост ценностей» помочь вам с ними.
