key: most_tsennostey_telegram
version: 1
title: Мост ценностей — Telegram
steps:
  - key: day_1_welcome
    delay: 0m
    channel: telegram_most
    text: |-
      Доброго времени суток!

      Вы в пространстве, где мы исследуем внутреннюю опору и зависимость от внешних факторов: денег, отношений и чужого мнения.

      Иногда за внешней целью скрывается более глубокая потребность — в безопасности, любви, самоценности или внутренней силе.
  - key: day_1_about
    delay: 1m
    channel: telegram_most
    text: |-
      Что это за тренинг?

      Это практический офлайн-тренинг «Мост ценностей». За один день участники исследуют повторяющийся жизненный сценарий: страх потери, сложности с финансами, стремление заслужить любовь, болезненную реакцию на критику или желание всё контролировать.

      В программе — письменные практики, работа в парах, круги, личные беседы и упражнения с ценностями.
  - key: day_1_leader
    delay: 1m
    channel: telegram_most
    text: |-
      Кто ведёт программу?

      Программу ведёт Айсу Кам — автор духовно-коучинговых программ о внутреннем состоянии, ценностях и отношениях с собой, людьми и Высшим.

      Главный принцип программы — не навязывать готовые ответы, а помочь увидеть собственный сценарий и найти более свободный способ действовать.

      Важно: тренинг проходит в Москве 3 и 5 сентября; 4 сентября предусмотрена необязательная бесплатная выездная часть.
  - key: day_1_context
    delay: 1m
    channel: telegram_most
    text: |-
      Иногда кажется, что для спокойствия нам не хватает чего-то конкретного: денег, ответа близкого человека, признания, контроля или нужного результата.

      Сами желания нормальны. Трудность начинается, когда внешний объект становится единственным источником внутреннего равновесия.

      Внутренняя опора не означает отказаться от целей. Она означает не терять себя, пока желаемое ещё не пришло, и действовать яснее, не разрушая себя и отношения.
  - key: quiz_invite
    delay: 1m
    channel: telegram_most
    text: |-
      Сегодня мы поговорим о зависимости от внешних источников счастья и достигнутых результатов.

      Ответьте на пять вопросов, чтобы понять, какие глубокие программы сейчас активнее всего делают выборы за вас. Выбирайте вариант, который проявляется чаще всего или сильнее всего.
    buttons:
      - text: Пройти тест
  - key: quiz_reminder
    delay: 1h
    channel: telegram_most
    text: |-
      Небольшое напоминание: тест поможет заметить привычный сценарий. После результата вы сможете посмотреть короткий урок «Почему мы зависим от результата и как вернуть себе точку выбора».
    buttons:
      - text: Пройти тест
  - key: lesson
    delay: 1m
    channel: telegram_most
    text: |-
      Сейчас вы можете посмотреть короткий урок: «Почему мы зависим от результата и как вернуть себе точку выбора».

      В нём мы разберём, почему желаемый объект кажется единственным источником счастья, как возникает сужение внимания и как переключиться с результата на процесс.

      Ссылку на видео добавим сюда отдельно.
  - key: reflection
    delay: 30m
    channel: telegram_most
    text: Что откликнулось вам сильнее всего?
    buttons:
      - text: Я завишу от реакции людей
      - text: Я зацикливаюсь на деньгах
      - text: Мне сложно отпускать контроль
      - text: Я хочу разобрать свою ситуацию глубже
  - key: day_2_practice
    delay: 1d
    channel: telegram_most
    text: |-
      Доброго дня! Сильная реакция редко возникает на пустом месте. Обычно есть цепочка: событие, ожидание, напряжение в теле, импульс что-то срочно сделать и последствие.

      Сегодня выполните короткую письменную практику «Моя цепочка». Выберите обычную ситуацию последних 30 дней, где были сильное желание, страх потери, обида, контроль или зависимость от чужого решения.

      Запишите: объект желания; что он обещал дать внутри; препятствие; чувства и реакции тела; что перестали замечать; импульс; действие; краткий эффект и последующую цену. Отдельно отметьте, где можно было поставить паузу.
    buttons:
      - text: Я заполнил(а) практику
      - text: Показать пример
      - text: Мне сложно выбрать ситуацию
  - key: day_3_values
    delay: 1d
    channel: telegram_most
    text: |-
      Прекрасного дня! Когда мы опираемся только на результат, тревога заставляет сильнее торопиться, доказывать, давить или контролировать других.

      Ценность — это качество, которое можно проявить в действии уже сейчас: честность, уважение, мастерство, ответственность, смелость или благодарность.

      Можно хотеть денег и действовать профессионально; можно хотеть отношений и не отказываться от достоинства; можно стремиться к результату и не становиться функцией контроля.

      Вопрос не только в том, чего вы хотите достичь. Вопрос ещё и в том, каким человеком вы выбираете быть на этом пути.
  - key: day_4_invitation
    delay: 1d
    channel: telegram_most
    text: |-
      Приветствую! В живом формате можно пойти глубже: через телесные практики, письменную работу, диалоги в парах, круги и бережную поддержку ведущей.

      Офлайн-тренинг «Мост ценностей» пройдёт в Москве 3 и 5 сентября 2026 года. 4 сентября — необязательная бесплатная выездная часть.

      В группе до 12 человек. После тренинга у вас будет разобранный личный сценарий, три ключевые ценности, конкретное действие на 72 часа и план практики на 21 день.

      До 31 августа стоимость — 25 000 руб.; возможна внутренняя рассрочка, Долями и Яндекс Сплит.
    buttons:
      - text: Оставить заявку
  - key: day_5_objections
    delay: 1d
    channel: telegram_most
    text: Добрый день! Возможно, у вас появились сомнения. Выберите то, что ближе всего.
    buttons:
      - text: Я не уверен(а), что мне это поможет
        callback_data: doubt_help
      - text: Я боюсь открываться группе
        callback_data: group_fear
      - text: Я живу не в Москве
        callback_data: not_moscow
      - text: У меня нет времени
        callback_data: no_time
      - text: Для меня дорого
        callback_data: price
      - text: Я хочу прийти, но не знаю, подходит ли мне формат
        callback_data: format
  - key: day_7_reminder
    delay: 2d
    channel: telegram_most
    text: |-
      Напоминаю, что запись на тренинг «Мост ценностей» продолжается до 31 августа 2026 года.

      Группа небольшая, потому что в программе предусмотрены личные мини-беседы и работа с индивидуальным запросом. Если ваша устойчивость часто зависит от денег, отношений, признания или чужого решения, этот тренинг может быть вам полезен.
    buttons:
      - text: Посмотреть программу
        url: https://most.aisukam.ru/
      - text: Оставить заявку
  - key: closing
    delay: 1d
    channel: telegram_most
    text: |-
      Сегодня закрывается набор на тренинг «Мост ценностей».

      Участие добровольное: не нужно принимать решение из страха что-то упустить. Выберите формат, если готовы выделить время на внимательную работу с собой.
    buttons:
      - text: Занять место
      - text: Получить программу
        url: https://most.aisukam.ru/
      - text: Не сейчас
